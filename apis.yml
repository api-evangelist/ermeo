aid: ermeo
name: Ermeo
description: >-
  Ermeo (rebranded Causeway Field) is a French connected-operator / field-operations
  SaaS platform that lets industrial and field teams digitize paper procedures into
  dynamic, interactive workflows for inspections, maintenance, and interventions.
  Operators complete pre-built interactive forms on mobile, capture equipment and
  report data in the field in real time, and operational managers monitor all field
  work from a central console. Ermeo exposes a REST API secured with OAuth 2.0 so
  customers can connect their information systems (CMMS, MES, EDM) to import and
  synchronize equipment, forms, and reports and enrich the data collected in the field.
